<title>ISpend — Calendar</title>
<style>
:root {
  --primary: oklch(47% 0.125 192); --on-primary: oklch(99% 0.002 192);
  --primary-container: oklch(92% 0.045 192); --on-primary-container: oklch(12% 0.035 192);
  --secondary-container: oklch(92% 0.02 192); --on-secondary-container: oklch(12% 0.025 192);
  --surface: oklch(98.5% 0.008 192); --on-surface: oklch(11% 0.02 192);
  --surface-variant: oklch(93% 0.012 192); --on-surface-variant: oklch(38% 0.025 192);
  --surface-container-lowest: oklch(99.5% 0.003 192);
  --surface-container-low: oklch(97.5% 0.005 192);
  --surface-container-high: oklch(92.5% 0.015 192);
  --outline-variant: oklch(85% 0.015 192); --outline: oklch(72% 0.025 192);
  --error: oklch(42% 0.20 25);
  --radius-xs: 8px; --radius-sm: 12px; --radius-md: 16px; --radius-lg: 24px; --radius-full: 999px;
  --font-sans: 'Google Sans', 'Roboto', -apple-system, 'Segoe UI', sans-serif;
  --elevation-1: 0 1px 3px oklch(0% 0 0 / 0.08);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { font-family: var(--font-sans); font-size: 14px; color: var(--on-surface); background: var(--surface); display: flex; flex-direction: column; }
.status-bar { height: 28px; background: var(--surface-container-lowest); display: flex; align-items: center; padding: 0 16px; font-size: 12px; font-weight: 600; }

.app-bar { display: flex; align-items: center; padding: 4px 16px; background: var(--surface-container-lowest); gap: 8px; }
.app-bar .back { width: 36px; height: 36px; border-radius: var(--radius-full); border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.app-bar .back svg { width: 24px; height: 24px; fill: var(--on-surface); }
.app-bar h2 { font-size: 20px; font-weight: 500; flex: 1; }

/* Month selector */
.month-row {
  display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--surface-container-lowest);
}
.month-row button {
  width: 32px; height: 32px; border-radius: var(--radius-full); border: none;
  background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--on-surface-variant);
}
.month-row button svg { width: 20px; height: 20px; fill: currentColor; }
.month-row .month-label { flex: 1; text-align: center; font-size: 14px; font-weight: 500; }

.scroll { flex: 1; overflow-y: auto; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }

/* Calendar grid */
.cal-grid {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center;
}
.cal-header {
  font-size: 11px; font-weight: 600; color: var(--on-surface-variant); padding: 4px 0;
}
.cal-day {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-full); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: background .15s; position: relative;
}
.cal-day.other { color: var(--on-surface-variant); opacity: 0.4; }
.cal-day.today { border: 2px solid var(--primary); }
.cal-day.selected { background: var(--primary); color: var(--on-primary); }

/* Heat map intensity classes */
.heat-0 { background: transparent; }
.heat-1 { background: oklch(92% 0.045 192 / 0.3); }
.heat-2 { background: oklch(92% 0.045 192 / 0.5); }
.heat-3 { background: oklch(92% 0.045 192 / 0.7); }
.heat-4 { background: var(--primary-container); color: var(--on-primary-container); }

/* Day summary card */
.day-card {
  background: var(--surface-container-low); border-radius: var(--radius-md);
  padding: 14px 16px; box-shadow: var(--elevation-1);
}
.day-card h3 { font-size: 14px; font-weight: 500; margin-bottom: 8px; }
.day-item {
  display: flex; align-items: center; gap: 8px; padding: 6px 0;
  font-size: 13px;
}
.day-item .emoji { font-size: 18px; }
.day-item .desc { flex: 1; }
.day-item .amt { font-weight: 600; }

/* Legend */
.legend {
  display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--on-surface-variant);
}
.legend .swatch { width: 16px; height: 16px; border-radius: 4px; }

.bottom-nav {
  display: flex; background: var(--surface-container-lowest);
  border-top: 1px solid var(--outline-variant); padding: 6px 8px 10px;
  justify-content: space-around;
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 4px 12px; border-radius: var(--radius-md); cursor: pointer;
  text-decoration: none; color: var(--on-surface-variant); font-size: 11px; font-weight: 500; min-width: 56px;
}
.nav-item.active { color: var(--primary); }
.nav-item svg { width: 24px; height: 24px; fill: currentColor; }
</style>
</head>
