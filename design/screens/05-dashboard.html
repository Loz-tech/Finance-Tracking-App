<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISpend — Analytics</title>
<style>
:root {
  --primary: oklch(47% 0.125 192); --on-primary: oklch(99% 0.002 192);
  --primary-container: oklch(92% 0.045 192); --on-primary-container: oklch(12% 0.035 192);
  --secondary: oklch(50% 0.04 192); --secondary-container: oklch(92% 0.02 192);
  --tertiary: oklch(48% 0.09 285); --tertiary-container: oklch(92% 0.035 285);
  --surface: oklch(98.5% 0.008 192); --on-surface: oklch(11% 0.02 192);
  --surface-variant: oklch(93% 0.012 192); --on-surface-variant: oklch(38% 0.025 192);
  --surface-container-lowest: oklch(99.5% 0.003 192);
  --surface-container-low: oklch(97.5% 0.005 192);
  --surface-container: oklch(95.5% 0.008 192);
  --surface-container-high: oklch(92.5% 0.015 192);
  --outline-variant: oklch(85% 0.015 192); --outline: oklch(72% 0.025 192);
  --error: oklch(42% 0.20 25);
  --radius-xs: 8px; --radius-sm: 12px; --radius-md: 16px; --radius-lg: 24px; --radius-full: 999px;
  --font-sans: 'Google Sans', 'Roboto', -apple-system, 'Segoe UI', sans-serif;
  --elevation-1: 0 1px 3px oklch(0% 0 0 / 0.08); --elevation-2: 0 3px 6px oklch(0% 0 0 / 0.10);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { font-family: var(--font-sans); font-size: 14px; color: var(--on-surface); background: var(--surface); display: flex; flex-direction: column; }
.status-bar { height: 28px; background: var(--surface-container-lowest); display: flex; align-items: center; padding: 0 16px; font-size: 12px; font-weight: 600; }

.app-bar { display: flex; align-items: center; padding: 4px 16px; background: var(--surface-container-lowest); }
.app-bar h2 { font-size: 20px; font-weight: 500; }

/* Period selector */
.period-row {
  display: flex; gap: 8px; padding: 8px 16px;
  background: var(--surface-container-lowest);
}
.period-btn {
  padding: 6px 16px; border-radius: var(--radius-xs); font-size: 13px; font-weight: 500;
  border: 1px solid var(--outline-variant); background: transparent;
  color: var(--on-surface-variant); cursor: pointer; font-family: var(--font-sans);
}
.period-btn.active { background: var(--secondary-container); color: var(--on-secondary-container); border-color: transparent; }

.scroll { flex: 1; overflow-y: auto; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 16px; -webkit-overflow-scrolling: touch; }

.card { background: var(--surface-container-low); border-radius: var(--radius-md); padding: 16px; box-shadow: var(--elevation-1); }

/* Summary stats */
.stats-row { display: flex; gap: 8px; }
.stat-box { flex: 1; background: var(--surface-container-low); border-radius: var(--radius-sm); padding: 12px; text-align: center; }
.stat-box .value { font-size: 18px; font-weight: 600; }
.stat-box .label { font-size: 11px; color: var(--on-surface-variant); margin-top: 2px; }

/* Donut chart */
.donut { display: flex; align-items: center; justify-content: center; gap: 24px; flex-wrap: wrap; }
.donut svg { width: 160px; height: 160px; transform: rotate(-90deg); }
.donut-legend { display: flex; flex-direction: column; gap: 6px; min-width: 120px; }
.donut-legend .item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.donut-legend .dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.donut-legend .amt { margin-left: auto; font-weight: 600; }

/* Bar chart */
.bars { display: flex; align-items: flex-end; gap: 8px; height: 160px; justify-content: space-between; padding: 0 4px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.bar-col .bar {
  width: 100%; border-radius: var(--radius-xs) var(--radius-xs) 0 0;
  background: var(--primary-container); transition: height .3s;
  max-width: 36px; position: relative;
}
.bar-col .bar::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0; top: 0;
  border-radius: var(--radius-xs) var(--radius-xs) 0 0;
  background: var(--primary); opacity: 0.5;
}
.bar-col .label { font-size: 10px; color: var(--on-surface-variant); }

.bottom-nav {
  display: flex; background: var(--surface-container-lowest);
  border-top: 1px solid var(--outline-variant); padding: 6px 8px 10px;
  justify-content: space-around;
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 4px 12px; border-radius: var(--radius-md); cursor: pointer;
  text-decoration: none; color: var(--on-surface-variant); font-size: 11px; font-weight: 500; min-width: 56px;
}
.nav-item.active { color: var(--primary); }
.nav-item svg { width: 24px; height: 24px; fill: currentColor; }
</style>
</head>
<body>

<div class="status-bar"><span>9:41</span></div>

<div class="app-bar"><h2>Analytics</h2></div>

<div class="period-row">
  <button class="period-btn">Week</button>
  <button class="period-btn active">Month</button>
  <button class="period-btn">Year</button>
</div>

<div class="scroll">

  <!-- Summary -->
  <div class="stats-row">
    <div class="stat-box"><div class="value">$1,840</div><div class="label">Total Spent</div></div>
    <div class="stat-box"><div class="value">$62.40</div><div class="label">Avg / Day</div></div>
    <div class="stat-box"><div class="value" style="color:var(--primary)">🍔</div><div class="label">Top Category</div></div>
  </div>

  <!-- Donut Chart — Category Breakdown -->
  <div class="card">
    <h3 style="font-size:14px;font-weight:500;margin-bottom:12px;">By Category</h3>
    <div class="donut">
      <svg viewBox="0 0 160 160">
        <circle cx="80" cy="80" r="64" fill="none" stroke="var(--surface-container-high)" stroke-width="24"/>
        <!-- Food 39% → 140.4° -->
        <circle cx="80" cy="80" r="64" fill="none" stroke="oklch(60% 0.16 35)" stroke-width="24"
          stroke-dasharray="156.8 402.1" stroke-linecap="butt"/>
        <!-- Transport 17% → 61.2° -->
        <circle cx="80" cy="80" r="64" fill="none" stroke="oklch(58% 0.18 255)" stroke-width="24"
          stroke-dasharray="68.3 402.1" stroke-linecap="butt"
          stroke-dashoffset="-156.8"/>
        <!-- Shopping 22% → 79.2° -->
        <circle cx="80" cy="80" r="64" fill="none" stroke="oklch(64% 0.13 28)" stroke-width="24"
          stroke-dasharray="88.4 402.1" stroke-linecap="butt"
          stroke-dashoffset="-225.1"/>
        <!-- Bills 12% → 43.2° -->
        <circle cx="80" cy="80" r="64" fill="none" stroke="oklch(58% 0.16 145)" stroke-width="24"
          stroke-dasharray="48.2 402.1" stroke-linecap="butt"
          stroke-dashoffset="-313.5"/>
        <!-- Others 10% → 36° -->
        <circle cx="80" cy="80" r="64" fill="none" stroke="oklch(48% 0.09 285)" stroke-width="24"
          stroke-dasharray="40.2 402.1" stroke-linecap="butt"
          stroke-dashoffset="-361.7"/>
      </svg>
      <div class="donut-legend">
        <div class="item"><span class="dot" style="background:oklch(60% 0.16 35)"></span>Food<span class="amt">$720</span></div>
        <div class="item"><span class="dot" style="background:oklch(64% 0.13 28)"></span>Shopping<span class="amt">$410</span></div>
        <div class="item"><span class="dot" style="background:oklch(58% 0.18 255)"></span>Transport<span class="amt">$340</span></div>
        <div class="item"><span class="dot" style="background:oklch(58% 0.16 145)"></span>Bills<span class="amt">$220</span></div>
        <div class="item"><span class="dot" style="background:oklch(48% 0.09 285)"></span>Others<span class="amt">$150</span></div>
      </div>
    </div>
  </div>

  <!-- Bar Chart — Daily Spending -->
  <div class="card">
    <h3 style="font-size:14px;font-weight:500;margin-bottom:12px;">Daily Spending (Last 7 Days)</h3>
    <div class="bars">
      <div class="bar-col"><div class="bar" style="height:96px;"></div><div class="label">Apr 29</div></div>
      <div class="bar-col"><div class="bar" style="height:48px;"></div><div class="label">30</div></div>
      <div class="bar-col"><div class="bar" style="height:120px;"></div><div class="label">May 1</div></div>
      <div class="bar-col"><div class="bar" style="height:32px;"></div><div class="label">2</div></div>
      <div class="bar-col"><div class="bar" style="height:88px;"></div><div class="label">3</div></div>
      <div class="bar-col"><div class="bar" style="height:140px;"></div><div class="label">4</div></div>
      <div class="bar-col"><div class="bar" style="height:56px;"></div><div class="label">5</div></div>
    </div>
  </div>

  <!-- Trend -->
  <div class="card" style="display:flex;align-items:center;gap:12px;">
    <div style="font-size:28px;">📈</div>
    <div>
      <div style="font-weight:500;">Spending trend</div>
      <div style="font-size:13px;color:var(--error);">+12% vs last month</div>
    </div>
  </div>

</div>

<nav class="bottom-nav">
  <a class="nav-item" href="../01-home.html">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> Home
  </a>
  <a class="nav-item active" href="05-dashboard.html">
    <svg viewBox="0 0 24 24"><path d="M9 21H5c-1.1 0-2-.9-2-2V5c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2v14c0 1.1-.9 2-2 2zm10 0h-4c-1.1 0-2-.9-2-2v-8c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2v8c0 1.1-.9 2-2 2z"/></svg> Analytics
  </a>
  <a class="nav-item" href="04-search.html">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg> Search
  </a>
  <a class="nav-item" href="09-settings.html">
    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94L14.4 2.81a.484.484 0 00-.41-.3h-3.98c-.2 0-.38.12-.45.3l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.69 8.87a.49.49 0 00.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.38.31.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.17.24.3.45.3h3.98c.2 0 .38-.12.41-.3l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96a.49.49 0 00.59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg> Settings
  </a>
</nav>

<script>
document.querySelectorAll('.period-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    this.parentElement.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
  });
});
</script>

</body>
</html>
