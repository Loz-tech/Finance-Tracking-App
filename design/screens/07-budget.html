<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISpend — Budget</title>
<style>
:root {
  --primary: oklch(47% 0.125 192); --on-primary: oklch(99% 0.002 192);
  --primary-container: oklch(92% 0.045 192); --on-primary-container: oklch(12% 0.035 192);
  --secondary-container: oklch(92% 0.02 192); --on-secondary-container: oklch(12% 0.025 192);
  --surface: oklch(98.5% 0.008 192); --on-surface: oklch(11% 0.02 192);
  --surface-variant: oklch(93% 0.012 192); --on-surface-variant: oklch(38% 0.025 192);
  --surface-container-lowest: oklch(99.5% 0.003 192);
  --surface-container-low: oklch(97.5% 0.005 192);
  --surface-container-high: oklch(92.5% 0.015 192);
  --outline-variant: oklch(85% 0.015 192); --outline: oklch(72% 0.025 192);
  --error: oklch(42% 0.20 25);
  --radius-xs: 8px; --radius-sm: 12px; --radius-md: 16px; --radius-lg: 24px; --radius-full: 999px;
  --font-sans: 'Google Sans', 'Roboto', -apple-system, 'Segoe UI', sans-serif;
  --elevation-1: 0 1px 3px oklch(0% 0 0 / 0.08); --elevation-2: 0 3px 6px oklch(0% 0 0 / 0.10);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { font-family: var(--font-sans); font-size: 14px; color: var(--on-surface); background: var(--surface); display: flex; flex-direction: column; }
.status-bar { height: 28px; background: var(--surface-container-lowest); display: flex; align-items: center; padding: 0 16px; font-size: 12px; font-weight: 600; }

.app-bar { display: flex; align-items: center; padding: 4px 16px; background: var(--surface-container-lowest); gap: 8px; }
.app-bar .back { width: 36px; height: 36px; border-radius: var(--radius-full); border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.app-bar .back svg { width: 24px; height: 24px; fill: var(--on-surface); }
.app-bar h2 { font-size: 20px; font-weight: 500; flex: 1; }

.scroll { flex: 1; overflow-y: auto; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }

/* Summary */
.budget-summary {
  background: var(--surface-container-low); border-radius: var(--radius-md);
  padding: 16px; box-shadow: var(--elevation-1);
}
.budget-summary .total-row {
  display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px;
}
.budget-summary .total { font-size: 28px; font-weight: 600; }
.budget-summary .label { font-size: 14px; color: var(--on-surface-variant); }
.budget-summary .sub-bar {
  width: 100%; height: 8px; border-radius: 4px; background: var(--surface-container-high);
  overflow: hidden;
}
.budget-summary .sub-fill { height: 100%; border-radius: 4px; background: var(--primary); transition: width .3s; }
.budget-summary .sub-text { font-size: 12px; color: var(--on-surface-variant); margin-top: 6px; }

/* Budget category item */
.budget-item {
  background: var(--surface-container-low); border-radius: var(--radius-md);
  padding: 14px 16px; box-shadow: var(--elevation-1);
  display: flex; flex-direction: column; gap: 8px;
}
.budget-item .header { display: flex; align-items: center; gap: 10px; }
.budget-item .emoji { font-size: 22px; }
.budget-item .name { font-size: 15px; font-weight: 500; flex: 1; }
.budget-item .amount { font-size: 15px; font-weight: 600; }

/* Custom range input styled as slider */
.slider-row { display: flex; align-items: center; gap: 8px; }
.slider-row input[type=range] {
  flex: 1; -webkit-appearance: none; appearance: none; height: 6px;
  border-radius: 3px; background: var(--surface-container-high); outline: none;
}
.slider-row input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
  background: var(--primary); cursor: pointer; border: 2px solid var(--on-primary);
  box-shadow: 0 1px 3px oklch(0% 0 0 / 0.2);
}
.slider-row .min, .slider-row .max { font-size: 12px; color: var(--on-surface-variant); min-width: 36px; }
.slider-row .max { text-align: right; }

/* Presets */
.preset-row { display: flex; gap: 6px; }
.preset-chip {
  padding: 4px 12px; border-radius: var(--radius-xs);
  border: 1px solid var(--outline-variant); font-size: 11px; font-weight: 500;
  color: var(--on-surface-variant); cursor: pointer; background: transparent;
  font-family: var(--font-sans); transition: all .15s;
}
.preset-chip.active { background: var(--secondary-container); color: var(--on-secondary-container); border-color: transparent; }

.bottom-nav {
  display: flex; background: var(--surface-container-lowest);
  border-top: 1px solid var(--outline-variant); padding: 6px 8px 10px;
  justify-content: space-around;
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 4px 12px; border-radius: var(--radius-md); cursor: pointer;
  text-decoration: none; color: var(--on-surface-variant); font-size: 11px; font-weight: 500; min-width: 56px;
}
.nav-item.active { color: var(--primary); }
.nav-item svg { width: 24px; height: 24px; fill: currentColor; }
</style>
</head>
<body>

<div class="status-bar"><span>9:41</span></div>

<div class="app-bar">
  <button class="back" onclick="location.href='../01-home.html'">
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
  </button>
  <h2>Monthly Budget</h2>
</div>

<div class="scroll">

  <!-- Total -->
  <div class="budget-summary">
    <div class="total-row"><span class="total">$3,000</span><span class="label">/ month total budget</span></div>
    <div class="sub-bar"><div class="sub-fill" style="width:61%"></div></div>
    <div class="sub-text">$1,840 spent · $1,160 remaining (61%)</div>
  </div>

  <!-- Food -->
  <div class="budget-item">
    <div class="header"><span class="emoji">🍔</span><span class="name">Food & Dining</span><span class="amount" id="foodAmt">$800</span></div>
    <div class="slider-row">
      <span class="min">$0</span>
      <input type="range" min="0" max="2000" value="800" step="50" oninput="document.getElementById('foodAmt').textContent='$'+this.value">
      <span class="max">$2,000</span>
    </div>
    <div class="preset-row">
      <button class="preset-chip" onclick="setSlider(this,0,800,'foodAmt')">$400</button>
      <button class="preset-chip active" onclick="setSlider(this,0,800,'foodAmt')">$800</button>
      <button class="preset-chip" onclick="setSlider(this,0,1200,'foodAmt')">$1,200</button>
    </div>
  </div>

  <!-- Transport -->
  <div class="budget-item">
    <div class="header"><span class="emoji">🚗</span><span class="name">Transportation</span><span class="amount" id="transportAmt">$500</span></div>
    <div class="slider-row">
      <span class="min">$0</span>
      <input type="range" min="0" max="1000" value="500" step="50" oninput="document.getElementById('transportAmt').textContent='$'+this.value">
      <span class="max">$1,000</span>
    </div>
    <div class="preset-row">
      <button class="preset-chip" onclick="setSlider(this,1,300,'transportAmt')">$300</button>
      <button class="preset-chip active" onclick="setSlider(this,1,500,'transportAmt')">$500</button>
      <button class="preset-chip" onclick="setSlider(this,1,700,'transportAmt')">$700</button>
    </div>
  </div>

  <!-- Shopping -->
  <div class="budget-item">
    <div class="header"><span class="emoji">🛍️</span><span class="name">Shopping</span><span class="amount" id="shopAmt">$400</span></div>
    <div class="slider-row">
      <span class="min">$0</span>
      <input type="range" min="0" max="1000" value="400" step="50" oninput="document.getElementById('shopAmt').textContent='$'+this.value">
      <span class="max">$1,000</span>
    </div>
    <div class="preset-row">
      <button class="preset-chip" onclick="setSlider(this,2,200,'shopAmt')">$200</button>
      <button class="preset-chip active" onclick="setSlider(this,2,400,'shopAmt')">$400</button>
      <button class="preset-chip" onclick="setSlider(this,2,600,'shopAmt')">$600</button>
    </div>
  </div>

  <!-- Bills -->
  <div class="budget-item">
    <div class="header"><span class="emoji">💡</span><span class="name">Bills & Utilities</span><span class="amount" id="billsAmt">$500</span></div>
    <div class="slider-row">
      <span class="min">$0</span>
      <input type="range" min="0" max="1000" value="500" step="50" oninput="document.getElementById('billsAmt').textContent='$'+this.value">
      <span class="max">$1,000</span>
    </div>
    <div class="preset-row">
      <button class="preset-chip" onclick="setSlider(this,3,300,'billsAmt')">$300</button>
      <button class="preset-chip active" onclick="setSlider(this,3,500,'billsAmt')">$500</button>
      <button class="preset-chip" onclick="setSlider(this,3,700,'billsAmt')">$700</button>
    </div>
  </div>

  <!-- Entertainment -->
  <div class="budget-item">
    <div class="header"><span class="emoji">🎬</span><span class="name">Entertainment</span><span class="amount" id="funAmt">$200</span></div>
    <div class="slider-row">
      <span class="min">$0</span>
      <input type="range" min="0" max="500" value="200" step="25" oninput="document.getElementById('funAmt').textContent='$'+this.value">
      <span class="max">$500</span>
    </div>
    <div class="preset-row">
      <button class="preset-chip" onclick="setSlider(this,4,100,'funAmt')">$100</button>
      <button class="preset-chip active" onclick="setSlider(this,4,200,'funAmt')">$200</button>
      <button class="preset-chip" onclick="setSlider(this,4,300,'funAmt')">$300</button>
    </div>
  </div>

  <button class="budget-item" style="cursor:pointer;justify-content:center;align-items:center;background:var(--primary-container);color:var(--on-primary-container);font-weight:500;font-size:14px;border:none;font-family:var(--font-sans);" onclick="alert('Budget saved!')">
    Save Budget
  </button>

</div>

<nav class="bottom-nav">
  <a class="nav-item" href="../01-home.html"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> Home</a>
  <a class="nav-item active" href="05-dashboard.html"><svg viewBox="0 0 24 24"><path d="M9 21H5c-1.1 0-2-.9-2-2V5c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2v14c0 1.1-.9 2-2 2zm10 0h-4c-1.1 0-2-.9-2-2v-8c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2v8c0 1.1-.9 2-2 2z"/></svg> Analytics</a>
  <a class="nav-item" href="04-search.html"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg> Search</a>
  <a class="nav-item" href="09-settings.html"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94L14.4 2.81a.484.484 0 00-.41-.3h-3.98c-.2 0-.38.12-.45.3l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.69 8.87a.49.49 0 00.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.38.31.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.17.24.3.45.3h3.98c.2 0 .38-.12.41-.3l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96a.49.49 0 00.59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg> Settings</a>
</nav>

<script>
function setSlider(btn, idx, val, labelId) {
  const slider = btn.closest('.budget-item').querySelector('input[type=range]');
  slider.value = val;
  document.getElementById(labelId).textContent = '$' + val;
  btn.parentElement.querySelectorAll('.preset-chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
}
</script>

</body>
</html>
